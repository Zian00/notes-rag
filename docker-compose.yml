services:
  postgres:
    # paradedb bundles both pg_search (BM25 keyword search) and pgvector (dense
    # search) — one image covers both retrieval paths. pg16 tag matches the
    # major version of the existing postgres_data volume.
    image: paradedb/paradedb:pg16
    container_name: notes_rag_postgres
    # pg_search's BM25 index type only works when its C extension is loaded at
    # server startup (not just CREATE EXTENSION) — Postgres requires this for
    # background-worker-backed index access methods.
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes_rag
    ports:
      # Host 5433 -> container 5432 to avoid clashing with a native Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: notes_rag_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://notes:notes@postgres:5432/notes_rag
      JWT_SECRET: dev-only-change-me
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:5173"]'
      UPLOAD_DIR: /data/uploads
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  uploads_data:
