services:
  postgres:
    # paradedb bundles both pg_search (BM25 keyword search) and pgvector (dense
    # search) — one image covers both retrieval paths. pg16 tag matches the
    # major version of the existing postgres_data volume.
    image: paradedb/paradedb:pg16
    container_name: notes_rag_postgres
    # No shared_preload_libraries override here: the image's own default
    # postgresql.conf already sets 'pg_search,pg_cron,pg_stat_statements', which
    # its bootstrap script (10_bootstrap_paradedb.sh) requires. A `-c` override
    # REPLACES that GUC instead of extending it, dropping pg_cron/pg_stat_statements
    # and crashing bootstrap on a fresh volume (confirmed via CI `docker logs`).
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes_rag
    ports:
      # Host 5433 -> container 5432 to avoid clashing with a native Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: notes_rag_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://notes:notes@postgres:5432/notes_rag
      JWT_SECRET: dev-only-wT5dZWErzwdmrS20Wa2y5mFl2Jf3gLHZQQisdXB1mgw
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:5173"]'
      UPLOAD_DIR: /data/uploads
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"
    # Lets `worker` (below) wait for migrations + procrastinate schema apply to
    # finish, not just for the container process to start.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    # Background job consumer for the procrastinate queue (see
    # docs/superpowers/specs/2026-07-26-ingestion-quality-design.md §7.1) — runs
    # process_document/process_document_replace as a separate process so heavy
    # ingestion CPU work (semantic chunking, reranking) never competes with the
    # API's event loop.
    build: ./backend
    container_name: notes_rag_worker
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://notes:notes@postgres:5432/notes_rag
      JWT_SECRET: dev-only-wT5dZWErzwdmrS20Wa2y5mFl2Jf3gLHZQQisdXB1mgw
      ENVIRONMENT: development
      UPLOAD_DIR: /data/uploads
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - uploads_data:/data/uploads
    # python -m procrastinate (not the bare console script) — only the module
    # form puts /app on sys.path so the dotted --app path resolves (see Dockerfile).
    command: ["uv", "run", "--no-sync", "python", "-m", "procrastinate", "--app", "app.jobs.ingestion_tasks.app", "worker"]

volumes:
  postgres_data:
  uploads_data:
