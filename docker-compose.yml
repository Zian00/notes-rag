services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notes_rag_postgres
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes_rag
    ports:
      # Host 5433 -> container 5432 to avoid clashing with a native Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: notes_rag_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://notes:notes@postgres:5432/notes_rag
      JWT_SECRET: dev-only-change-me
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:5173"]'
      UPLOAD_DIR: /data/uploads
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  uploads_data:
