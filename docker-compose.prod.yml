services:
  postgres:
    image: paradedb/paradedb:pg16
    container_name: notes_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: notes_rag_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      UPLOAD_DIR: /data/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_PROVIDER: openai
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: ./backend
    container_name: notes_rag_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
      UPLOAD_DIR: /data/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - uploads_data:/data/uploads
    command: ["uv", "run", "--no-sync", "python", "-m", "procrastinate", "--app", "app.jobs.ingestion_tasks.app", "worker"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: notes_rag_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
