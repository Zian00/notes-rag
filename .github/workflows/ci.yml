name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://notes:notes@localhost:5432/notes_rag
      TEST_DATABASE_URL: postgresql+asyncpg://notes:notes@localhost:5432/notes_rag
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (paradedb, pg_search preloaded)
        # GitHub Actions' `services:` block can't override a service container's
        # command, but pg_search's BM25 index type requires shared_preload_libraries
        # set at server startup (-c flag) — so Postgres is started manually here
        # instead of via `services:`.
        run: |
          docker run -d --name notes_rag_postgres \
            -e POSTGRES_USER=notes -e POSTGRES_PASSWORD=notes -e POSTGRES_DB=notes_rag \
            -p 5432:5432 \
            paradedb/paradedb:pg16 postgres -c shared_preload_libraries=pg_search
          ready=""
          for i in $(seq 1 60); do
            if docker exec notes_rag_postgres pg_isready -U notes -d notes_rag; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Postgres did not become ready within 60s"
            docker logs notes_rag_postgres
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.13
      - name: Install OCR system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy app
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest
