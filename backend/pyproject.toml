[project]
name = "notes-rag-backend"
version = "0.0.0"
description = "Agentic RAG backend for lecture notes (FastAPI + LangGraph)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pgvector>=0.3.6",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "pydantic[email]>=2.13.4",
    "pypdf>=5.1",
    "pdf2image>=1.17",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.8",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "fpdf2>=2.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"
